[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopdemand"
version = "0.1.0"
description = "Demand research on the Shopify App Store: find niches with real spend and weak incumbents"
requires-python = ">=3.10"
dependencies = ["requests", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]
